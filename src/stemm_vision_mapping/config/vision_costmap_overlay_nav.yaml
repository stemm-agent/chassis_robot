# 视觉融合【导航模式】叠加参数（与生产 param_four_wheel_diff.yaml 深合并使用）
#
# 相对生产，本文件**只做两类改动**（其余每个节点段一律照搬生产原值）：
#   [A] 代价地图图层（本项目的核心差异：加入实时深度层）
#       local : voxel_layer(2D激光) → vision_voxel_layer(实时深度) → inflation_layer
#       global: static_layer(融合地图) → obstacle_layer(2D激光) → inflation_layer
#   [B] AMCL 硬起点播种（生产靠上层粗先验 + 守卫；本模式无守卫，故由参数播种）
#       set_initial_pose: true + initial_pose.*（可用 launch 参数 initial_x/y/yaw 覆盖）
#       tf_broadcast 保持生产值 false —— map→odom_combined 由 amcl_odom_limiter 独占发布

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ['voxel_layer', 'vision_voxel_layer', 'inflation_layer']
      vision_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: vision_cloud
        vision_cloud:
          topic: /vision/live_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 2026-09-22: 0.26 m camera mount height confirmed by an 11 cm reference object
          # (reconstructed top 0.12-0.16 m). The floor is not visible closer than ~1.8 m, so the
          # low band contains real structure only -> keep the gate at the original 0.05 m.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_max_range: 5.0
          obstacle_min_range: 0.25
          raytrace_max_range: 6.0
          raytrace_min_range: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']

amcl:
  ros__parameters:
    tf_broadcast: false          # 与生产一致：由 amcl_odom_limiter 独占发布 map→odom_combined
    set_initial_pose: true       # 本模式无守卫的粗先验，故由参数直接播种硬起点
    always_reset_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
