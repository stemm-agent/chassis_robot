# 视觉融合导航：代价地图叠加参数（与生产 param_four_wheel_diff.yaml 合并使用）
#
# 用法：ros2 launch ... params_file:=<生产参数> 并额外加载本文件（见 scripts/start_vision_nav_test.sh）
# 设计原则：**只增不改** —— 原有图层与其参数逐字保留，仅在末尾追加两层视觉图层。
#
# 1) local_costmap.vision_voxel_layer：吃相机深度实时点云（/vision/live_cloud）
#    - 动态障碍，可标记也可清除（物体移开会消失）
#    - min_obstacle_height 0.05 / max 1.80：正好覆盖激光扫描面（约 0.24 m）以下的低矮障碍
# 2) global_costmap.vision_static_layer：吃累积的深度障碍栅格（/vision/obstacle_grid）
#    - 只增不减（建图期累积的"激光盲区障碍"），track_unknown_space=true
#      保证未知格不会被当成空闲（否则会把激光障碍"洗掉"的风险）
#
# 安全：vision 层只增加障碍，不降低任何已有图层代价。

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ['voxel_layer', 'inflation_layer', 'vision_voxel_layer']
      vision_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: vision_cloud
        vision_cloud:
          topic: /vision/live_cloud
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_max_range: 5.0
          obstacle_min_range: 0.25
          raytrace_max_range: 6.0
          raytrace_min_range: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer', 'vision_static_layer']
      vision_static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_topic: /vision/obstacle_grid
        map_subscribe_transient_local: True
        subscribe_to_updates: False
        track_unknown_space: True
        trinary_costmap: True
        lethal_cost_threshold: 65
