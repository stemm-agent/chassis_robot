# Install as:
# /etc/systemd/system/wheeltec-recharge-manager.service.d/
#   20-stemm-cartographer-fast-stop.conf
[Service]
# Signal every process in the service cgroup so the real recharge_manager node
# can execute its KeyboardInterrupt cleanup.  Keep the unit's existing 45-second
# fallback until an active-recharge stop has been validated with the wheels safe.
KillMode=control-group
KillSignal=SIGINT
