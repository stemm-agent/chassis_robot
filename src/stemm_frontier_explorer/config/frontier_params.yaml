# stemm_frontier_explorer 参数
# 与旧 RRT 链路（config/exploration_params.yaml）对照：
#   RRT 链的 filter/assigner 也有 info_radius / info_multiplier / hysteresis_*，
#   但候选点由随机采样产生；本包改为穷举前沿簇，分数项更明确。
frontier_explorer:
  ros__parameters:
    # ---- 输入 ----
    map_topic: /map
    global_costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    nav_state_topic: /stemm_cartographer/nav_state
    global_frame: map
    map_timeout_sec: 10.0
    costmap_timeout_sec: 3.0

    # ---- 输出（下游契约：manager 订阅 PoseStamped）----
    frontier_goal_topic: /assigned_frontier_goal

    # ---- 节奏 ----
    goal_interval_sec: 3.0
    no_goal_log_interval_sec: 5.0

    # ---- 候选点几何 ----
    min_goal_distance: 0.6
    max_goal_distance: 8.0          # 决策半径上限（成本护栏，见 2026-10-10 设计）
    obstacle_clearance: 0.38
    known_clearance: 0.20
    corridor_clearance: 0.28
    frontier_radius: 0.7
    min_frontier_cells: 8

    # ---- 打分权重 ----
    gain_scale: 1.0
    potential_scale: 1.2
    clearance_scale: 0.8
    lookahead_scale: 0.35

    # ---- 失败点记忆 ----
    bad_goal_radius: 0.55
    blocked_place_radius: 0.55
    bad_ttl_sec: 240.0

    # ---- 成本护栏（2026-10-10 新增）----
    # 全图距离场 + BFS 是 O(格数)，507x587 约 30 万格。限制处理窗口半径，
    # 避免每拍都对全图做穷举；8.0m 覆盖 max_goal_distance 即可。
    search_window_radius_m: 8.0
